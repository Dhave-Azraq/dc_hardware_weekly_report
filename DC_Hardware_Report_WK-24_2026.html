// Convert [Source Name] tags in news text to hyperlinks
function linkNews(text) {
  let html = esc(text);
  // Match [Source Name] patterns and replace with linked versions
  html = html.replace(/\[([^\]]+)\]/g, function(match, name) {
    const url = NEWS_LINKS[name];
    if (url) {
      return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="news-src" title="Source: ${name}">[${name}]</a>`;
    }
    return `<strong style="color:#002147">[${name}]</strong>`;
  });
  return html;
}

// Build tabs nav
const tabsNav=document.getElementById('tabs');
[["overview","Overview"],["hardware",`Hardware Catalog (${totalHW})`],["regions","Top 10 by Region"],["market",`Market Data (${MARKET_STATS.length})`]].forEach(([k,l])=>{
  const btn=document.createElement('button');
  btn.textContent=l;
  btn.dataset.tab=k;
  if(k===activeTab) btn.classList.add('active');
  btn.onclick=()=>switchTab(k);
  tabsNav.appendChild(btn);
});

function switchTab(k){
  activeTab=k;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===k));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id==='tab-'+k));
}
